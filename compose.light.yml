services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=15", "--performance-schema=OFF", "--innodb-log-buffer-size=8M", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codex_console}
      MYSQL_USER: ${MYSQL_USER:-codex_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 480m
    networks: [backend]
  mihomo:
    build:
      context: ./mihomo
      dockerfile: Dockerfile
    image: codex-console-mihomo:v1.19.31
    restart: unless-stopped
    command: ["-d", "/root/.config/mihomo", "-f", "/etc/mihomo/config.yaml"]
    cap_drop: [ALL]
    volumes:
      - ./mihomo/config.yaml:/etc/mihomo/config.yaml:ro
      - mihomo_data:/root/.config/mihomo
    ports:
      - "127.0.0.1:7890:7890"
    expose: ["7890"]
    mem_limit: 128m
    networks: [backend]
volumes:
  mysql_data:
  codex_auth:
    external: true
    name: codex-backend_codex_auth
  mihomo_data:
    external: true
    name: codex-backend_mihomo_data
networks:
  backend:
