services:
  gateway:
    build:
      context: ./frontend
      dockerfile: Dockerfile.static
    restart: unless-stopped
    ports:
      - "9999:80"
    volumes:
      - ./nginx/http.ecs.conf:/etc/nginx/conf.d/default.conf:ro
      - acme_webroot:/var/www/certbot:ro
    mem_limit: 48m
    networks: [edge]
  status-agent:
    image: codex-console-status-agent:67634eb
    build:
      context: ./backend
      dockerfile: Dockerfile.status-agent
    restart: unless-stopped
    environment:
      STATUS_AGENT_TOKEN: ${STATUS_AGENT_TOKEN}
      STATUS_SERVICES: '{"frontend":"http://gateway/"}'
    ports:
      - "10.0.7.126:9107:9107"
    volumes:
      - /:/host-root:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 24m
    networks: [edge]
  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
volumes:
  letsencrypt:
    name: codex-console_letsencrypt
  acme_webroot:
    external: true
    name: codex-console_acme_webroot
networks:
  edge:
