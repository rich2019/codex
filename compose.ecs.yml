services:
  gateway:
    build:
      context: ./frontend
      dockerfile: Dockerfile.static
    restart: unless-stopped
    ports:
      - "9999:80"
    volumes:
      - ./nginx/http.ecs.conf:/etc/nginx/conf.d/default.conf:ro
      - acme_webroot:/var/www/certbot:ro
    mem_limit: 48m
    networks: [edge]
  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
volumes:
  letsencrypt:
    name: codex-console_letsencrypt
  acme_webroot:
    external: true
    name: codex-console_acme_webroot
networks:
  edge:
